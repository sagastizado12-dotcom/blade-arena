<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#140e0a">
<title>Blade Arena</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg">
<style>
  html, body { margin: 0; height: 100%; background: #140e0a; overflow: hidden; touch-action: none; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; }
  #fade { position: fixed; inset: 0; background: #07060c; opacity: 0; pointer-events: none; transition: opacity .18s linear; z-index: 6; }
  #fade.on { opacity: 1; }
  #dlg {
    position: fixed; left: 10px; right: 10px; bottom: 158px; z-index: 5;
    background: #0e1c3a; color: #fff; border: 2px solid #f4f8ff;
    box-shadow: inset 0 0 0 3px #0e1c3a, inset 0 0 0 5px #9ad0ff;
    padding: 8px 8px 6px; display: none;
  }
  #dlg.show { display: block; }
  #who { font: 700 11px ui-monospace, monospace; color: #d6ecff; letter-spacing: .04em; margin-bottom: 4px; }
  #dlgC { width: 100%; height: 64px; image-rendering: pixelated; }
  #choices { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  #choices button, .pad button {
    font: 700 12px ui-monospace, monospace; color: #fff; background: #16325a;
    border: 2px solid #f4f8ff; box-shadow: inset 0 0 0 2px #7eb6e0;
    min-height: 36px; padding: 4px 8px;
  }
  #touch { position: fixed; inset: 0; pointer-events: none; z-index: 4; }
  #stick {
    position: absolute; left: 16px; bottom: 24px; width: 112px; height: 112px; pointer-events: auto;
    border-radius: 50%; background: rgba(14, 28, 58, .55); border: 2px solid #9ad0ff;
  }
  #knob {
    position: absolute; left: 40px; top: 40px; width: 32px; height: 32px; border-radius: 50%;
    background: #d6ecff;
  }
  #hotbar { position: absolute; right: 8px; bottom: 168px; display: grid; grid-template-columns: 72px 72px; gap: 4px; pointer-events: auto; z-index: 5; }
  #hotbar button { width: 72px; height: 40px; border-radius: 10px; font: 700 11px ui-monospace, monospace; color: #fff; background: #16325a; border: 2px solid #f4f8ff; box-shadow: inset 0 0 0 2px #7eb6e0; padding: 0; }
  #hotbar button.on { box-shadow: inset 0 0 0 2px #ffe08a, 0 0 0 2px #ffe08a; background: #2a4a78; }
  .pad { position: absolute; right: 10px; bottom: 18px; display: grid; grid-template-columns: 52px 52px; gap: 6px; pointer-events: auto; }
  .pad button { width: 52px; height: 44px; padding: 0; }
  #book { position: absolute; left: 8px; right: 8px; top: 72px; max-height: 46vh; overflow: auto;
    background: #0e1c3a; color: #fff; border: 2px solid #f4f8ff; box-shadow: inset 0 0 0 4px #9ad0ff;
    padding: 8px; display: none; pointer-events: auto; z-index: 6; }
  #book.show { display: block; }
  #book button { margin: 3px; }
  #mapBtn, #bookBtn {
    font: 700 10px system-ui, sans-serif; color: #ffefc0; background: rgba(30,15,30,.7);
    border: 2px solid #b08a3a; border-radius: 5px; min-width: 44px; min-height: 22px; padding: 3px 6px;
  }
  #mapBtn { position: absolute; top: 8px; right: 96px; pointer-events: auto; }
  #bookBtn { position: absolute; top: 8px; right: 148px; pointer-events: auto; }
  #bars { position: fixed; left: 8px; top: 34px; width: min(240px, 64vw); z-index: 6; pointer-events: none; }
  #bars .row { display: flex; align-items: center; }
  #bars .hp, #bars .sta { flex: 1; height: 12px; border: 2px solid #2a1808; background: #2a1a14; position: relative; overflow: hidden; }
  #bars .hp { border-radius: 7px 0 0 7px; }
  #bars .sta { border-radius: 0 7px 7px 0; }
  #bars .hp i { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; background: linear-gradient(#ff7a6a, #c8201a 60%, #8a1010); }
  #bars .sta i { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; background: linear-gradient(#ffe880, #e0b020 40%, #7ad050); }
  #bars .lv { min-width: 52px; height: 22px; margin: 0 -2px; z-index: 1; border-radius: 6px; border: 2px solid #d4a040; background: linear-gradient(#5a6a8a, #2a3048); color: #fff2c0; font: bold 12px Georgia, serif; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 2px #2a1808; }
  #bars .num { position: absolute; inset: 0; font: bold 9px system-ui, sans-serif; color: #fff; text-shadow: 0 1px 1px #000; display: flex; align-items: center; justify-content: center; }
  #spellLv { position: fixed; left: 8px; top: 60px; z-index: 6; color: #ffefc0; font: 700 10px system-ui, sans-serif; text-shadow: 1px 1px 0 #000; pointer-events: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="fade"></div>
<div id="dlg">
  <div id="who"></div>
  <canvas id="dlgC" width="360" height="64"></canvas>
  <div id="choices"></div>
</div>
<div id="bars">
  <div class="row">
    <div class="hp"><i id="hpFill"></i><span class="num" id="hpNum">10/10</span></div>
    <div class="lv" id="lvBadge">LV.01</div>
    <div class="sta" title="Stamina"><i id="staFill"></i><span class="num" id="staNum">∞</span></div>
  </div>
</div>
<div id="spellLv">Fire 1 · Thunder 1 · Heal 1 · Air 1</div>
<div id="touch">
  <button id="mapBtn" type="button">Map</button>
  <button id="bookBtn" type="button">Book</button>
  <div id="book"></div>
  <div id="stick"><div id="knob"></div></div>
  <div id="hotbar">
    <button type="button" data-spell="fire">1 Fire</button>
    <button type="button" data-spell="thunder">2 Thunder</button>
    <button type="button" data-spell="heal">3 Heal</button>
    <button type="button" data-spell="air">4 Air</button>
  </div>
  <div class="pad">
    <button type="button" data-act="swing">Sword</button>
    <button type="button" data-act="cast">Spell</button>
    <button type="button" data-act="jump">Jump</button>
    <button type="button" data-act="dash">Dash</button>
    <button type="button" data-act="fly">Fly</button>
    <button type="button" data-act="talk">Talk</button>
  </div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
